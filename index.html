<title>Santa Fe 2026</title>
<style>
/* ============================================================
   SANTA FE 2026 · archivo único autónomo
   3 jugadores · 2 días · un solo grupo · Stableford puro
   ============================================================ */
:root{
  --verde:#2B2E33; --verde-hondo:#16181C; --verde-linea:#3C4149;
  --tarjeta:#F4EFE3; --tarjeta-linea:#DDD4C0;
  --tinta:#1A1D19; --tinta-suave:#5C6459;
  --laton:#C9A227; --bandera:#C0392B; --cal:#A8AEB8; --ok:#3E7D5A;
  --r:10px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--verde-hondo);color:var(--tarjeta);font-family:var(--ui);font-size:17px;
  line-height:1.4;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select{font-family:inherit;font-size:17px}
button{cursor:pointer;border:none;background:none;color:inherit}

header{position:sticky;top:0;z-index:30;background:var(--verde);
  padding:calc(var(--safe-t) + 12px) 16px 0;border-bottom:1px solid var(--verde-linea)}
.marca{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.marca-der{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.marca-der .chips{display:flex;gap:6px}
.marca h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em;text-transform:uppercase}
.marca .fmt{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--laton);border:1px solid var(--laton);border-radius:4px;padding:2px 6px;white-space:nowrap}
.quien-soy{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--laton);text-align:right}
.quien-soy:empty{display:none}
.dias{display:flex;gap:6px;margin:11px 0 0;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.dias::-webkit-scrollbar{display:none}
.dia{flex:1 0 auto;padding:7px 14px;border-radius:99px;font-size:14.5px;font-weight:600;background:transparent;
  color:var(--cal);border:1px solid var(--verde-linea);white-space:nowrap;text-align:left;line-height:1.25}
.dia b{display:block;font-size:14.5px}
.dia i{display:block;font-style:normal;font-family:var(--mono);font-size:11px;letter-spacing:.06em;opacity:.75}
.dia.on{background:var(--tarjeta);color:var(--verde-hondo);border-color:var(--tarjeta)}
.dia-resumen{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;
  margin:9px 0 0;padding:0 0 10px;color:var(--tarjeta)}
.dia-resumen b{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dia-resumen i{font-style:normal;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;
  color:var(--cal);white-space:nowrap}
.dia-resumen u{margin-left:auto;text-decoration:none;color:var(--laton);font-size:12px;flex:none}

main{padding:14px 16px calc(84px + var(--safe-b));min-height:60vh}
.vista{display:none}
.vista.on{display:block;animation:sube .22s ease}
@keyframes sube{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

h2.sec{font-family:var(--mono);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--cal);margin:20px 0 8px;font-weight:600}
h2.sec:first-child{margin-top:2px}

.hoyo-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--tarjeta);
  color:var(--tinta);border-radius:var(--r);padding:12px 10px;margin-bottom:10px}
.flecha{width:46px;height:46px;border-radius:8px;background:var(--verde);color:var(--tarjeta);
  font-size:22px;font-weight:700;display:grid;place-items:center;flex:none}
.flecha:disabled{opacity:.25}
.hoyo-info{text-align:center;flex:1;min-width:0}
.hoyo-num{font-family:var(--mono);font-size:34px;font-weight:700;line-height:1;letter-spacing:-.02em}
.hoyo-num small{font-size:15px;font-weight:600;color:var(--tinta-suave);letter-spacing:0}
.hoyo-meta{font-family:var(--mono);font-size:13px;letter-spacing:.06em;color:var(--tinta-suave);
  margin-top:4px;text-transform:uppercase}

.jug-fila{background:var(--tarjeta);color:var(--tinta);border-radius:var(--r);padding:9px 11px;
  margin-bottom:7px;display:flex;flex-wrap:wrap;align-items:center;gap:9px}
.jug-id{flex:1;min-width:0}
.jug-nom{font-weight:700;font-size:17.5px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jug-sub{font-family:var(--mono);font-size:12px;color:var(--tinta-suave);margin-top:2px;letter-spacing:.02em;white-space:nowrap}
.golpe{display:flex;align-items:center;gap:5px;flex:none}
.bt{width:44px;height:44px;border-radius:8px;background:#E5DDC9;color:var(--tinta);font-size:23px;
  font-weight:700;display:grid;place-items:center}
.bt:active{background:#D6CBB2}
.marcador{min-width:50px;height:50px;display:grid;place-items:center;font-family:var(--mono);font-size:28px;font-weight:700}
.marcador.vacio{color:#B9AF97;font-size:21px}
.pts{font-family:var(--mono);font-size:13px;font-weight:700;min-width:26px;text-align:right;color:var(--tinta-suave);flex:none}
/* renglon propio: en la columna del nombre los chips se partian en tres */
.xtras{display:flex;flex-wrap:wrap;gap:6px;flex-basis:100%;align-items:center;margin-top:1px}
/* los puntos rojos de la ventaja, junto al nombre: uno por golpe recibido */
.gp-pts{color:var(--bandera);font-size:30px;line-height:0;letter-spacing:-3px;
  vertical-align:-4px;margin-left:3px}
.xtra{font-family:var(--mono);font-size:11px;letter-spacing:.02em;padding:0 7px;border-radius:99px;
  /* el emoji trae metricas de su propia fuente y estiraba la fila 30px: caja fija */
  line-height:1;height:21px;display:inline-flex;align-items:center;box-sizing:border-box;
  white-space:nowrap;flex:none;overflow:hidden;
  border:1px solid var(--tarjeta-linea);color:var(--tinta-suave);background:transparent}
.xtra.on{background:var(--laton);border-color:var(--laton);color:var(--verde-hondo);font-weight:700}
.xtra.pen.on{background:var(--bandera);border-color:var(--bandera);color:#fff;font-weight:700}
.xtra:disabled{opacity:.28}
sup.xmk{font-size:8.5px;color:var(--laton);font-weight:700;margin-left:1px}
sup.xmk.seg{color:var(--tinta-suave);font-weight:400}

/* Notación de tarjeta */
.nota{display:inline-grid;place-items:center;width:34px;height:34px;position:relative}
.nota.birdie::before,.nota.eagle::before,.nota.eagle::after{content:"";position:absolute;inset:1px;
  border:1.8px solid var(--bandera);border-radius:50%}
.nota.eagle::after{inset:5px}
.nota.bogey::before,.nota.doble::before,.nota.doble::after{content:"";position:absolute;inset:2px;
  border:1.8px solid var(--verde);border-radius:2px}
.nota.doble::after{inset:6px}

.barra-prog{height:3px;background:var(--verde-linea);border-radius:99px;overflow:hidden;margin:12px 0 4px}
.barra-prog i{display:block;height:100%;background:var(--laton);border-radius:99px;transition:width .3s ease}

.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r)}
table.card{border-collapse:collapse;background:var(--tarjeta);color:var(--tinta);width:100%;
  font-family:var(--mono);font-size:14px}
table.card th,table.card td{border:1px solid var(--tarjeta-linea);padding:5px 4px;text-align:center;min-width:33px;position:relative}
/* VENTAJA: triangulo rojo en la esquina superior derecha de la celda; el
   tamano dice cuantos golpes recibe ahi (uno, dos o tres) */
.tri{position:absolute;top:0;right:0;width:0;height:0;pointer-events:none;
  border-top:11px solid var(--bandera);border-left:11px solid transparent}
.tri.t2{border-top-width:16px;border-left-width:16px}
.tri.t3{border-top-width:21px;border-left-width:21px}
/* en la fila de captura la tarjeta es redondeada: la escuadra se mete un pelo */
.jug-fila{position:relative;overflow:hidden}
.jug-fila .tri{border-top-width:32px;border-left-width:32px}
.jug-fila .tri.t2{border-top-width:42px;border-left-width:42px}
.jug-fila .tri.t3{border-top-width:52px;border-left-width:52px}
/* La notacion de Hoy (circulo birdie, cuadro bogey) tambien en la cuadricula
   de golpes: la celda mide 33x31, asi que el trazo va a 21px en vez de 34. */
/* sobre el triangulo de ventaja, que ocupa la misma esquina: si no, el
   cuadro sale con una mordida y deja de leerse como cuadro */
table.card .nota{width:21px;height:21px;z-index:1}
table.card .nota.birdie::before,table.card .nota.eagle::before,
table.card .nota.eagle::after{inset:0;border-width:1.4px}
table.card .nota.eagle::after{inset:3px}
table.card .nota.bogey::before,table.card .nota.doble::before,
table.card .nota.doble::after{inset:1px;border-width:1.4px}
table.card .nota.doble::after{inset:4px}
.ch{font-family:var(--mono);font-size:11.5px;color:var(--cal);margin-left:5px;font-weight:400}
table.card th.nom,table.card td.nom{text-align:left;min-width:72px;white-space:nowrap;position:sticky;left:0;background:var(--tarjeta);
  z-index:2;font-family:var(--ui);font-weight:700;font-size:13px;border-right:2px solid var(--verde)}
table.card thead th{background:var(--verde);color:var(--tarjeta);font-weight:700;font-size:13px;border-color:var(--verde-linea)}
table.card thead th.nom{background:var(--verde);color:var(--tarjeta)}
table.card tr.par td{background:#EAE3D2;font-size:13px;color:var(--tinta-suave)}
table.card td.tot{background:#EAE3D2;font-weight:700}
td.bajo{color:var(--bandera);font-weight:700}
td.alto{color:var(--tinta-suave)}

.pos-fila{display:flex;align-items:center;gap:11px;background:var(--tarjeta);color:var(--tinta);
  border-radius:var(--r);padding:11px 13px;margin-bottom:7px}
.pos-fila.lider{box-shadow:inset 3px 0 0 var(--laton)}
.pos-n{font-family:var(--mono);font-size:17px;font-weight:700;width:27px;color:var(--tinta-suave);flex:none}
.pos-fila.lider .pos-n{color:var(--laton)}
.pos-id{flex:1;min-width:0}
.pos-rondas{font-family:var(--mono);font-size:12.5px;color:var(--tinta-suave);margin-top:2px;letter-spacing:.05em}
.pos-tot{font-family:var(--mono);font-size:23px;font-weight:700;flex:none;min-width:48px;text-align:right}
.pos-dias{display:flex;flex:none;gap:4px}
.pos-dias b{width:28px;text-align:right;font-family:var(--mono);font-size:14px;font-weight:600;color:var(--tinta-suave)}
.pos-cab{display:flex;align-items:center;gap:11px;padding:0 13px;margin:0 0 6px}
.pos-cab .pos-dias b,.pos-cab .pos-tot{font-size:10.5px;font-weight:600;color:var(--cal);letter-spacing:.03em;text-transform:uppercase}

.grupo{background:var(--tarjeta);color:var(--tinta);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.grupo h3{margin:0 0 7px;font-family:var(--mono);font-size:12.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--tinta-suave);font-weight:600;display:flex;justify-content:space-between}
.grupo h3 span{color:var(--verde);font-weight:700}
.grupo ol{margin:0;padding-left:19px}
.grupo li{font-size:16.5px;padding:2px 0;font-weight:600}
.grupo li span{font-family:var(--mono);font-size:13px;color:var(--tinta-suave);font-weight:400;margin-left:6px}
.grupo li{cursor:pointer;-webkit-tap-highlight-color:transparent}
.grupo li.sel{background:var(--laton);color:var(--verde-hondo);border-radius:6px;
  margin-left:-6px;padding-left:6px;padding-right:6px}
.grupo li.sel span{color:var(--verde-hondo)}
.sello.mal{color:var(--bandera);border-color:var(--bandera)}
.sello{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:13px;color:var(--ok);
  border:1px solid var(--ok);border-radius:99px;padding:4px 10px;margin-bottom:12px}
.aviso{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;color:var(--laton);
  border:1px solid var(--laton);border-radius:4px;padding:1px 6px;margin-left:6px;letter-spacing:.05em}

.campo{margin-bottom:11px}
.campo label{display:block;font-family:var(--mono);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--cal);margin-bottom:4px}
input[type=text],input[type=number],select{width:100%;padding:11px 12px;border-radius:8px;
  border:1px solid var(--verde-linea);background:var(--verde);color:var(--tarjeta);font-size:17px}
input:focus,select:focus{outline:2px solid var(--laton);outline-offset:1px}
.fila-jug{display:grid;grid-template-columns:1fr 102px 60px;gap:6px;margin-bottom:6px}
.fila-jug input{padding:9px 10px;font-size:17px}
.fila-jug input.corto{font-size:15px;padding-left:8px;padding-right:8px}
.segm{display:flex;gap:5px;background:var(--verde);border-radius:9px;padding:4px;margin-bottom:11px}
.segm button{flex:1;padding:9px 6px;border-radius:6px;font-size:15.5px;font-weight:600;color:var(--cal)}
.segm button.on{background:var(--tarjeta);color:var(--verde-hondo)}
.segm.pos-segm button{font-size:14px;padding:9px 4px}
.btn{display:block;width:100%;padding:13px;border-radius:9px;background:var(--laton);color:var(--verde-hondo);
  font-weight:700;font-size:17px;margin-top:9px}
.btn.sec{background:transparent;border:1px solid var(--verde-linea);color:var(--tarjeta)}
.btn.peligro{background:transparent;border:1px solid var(--bandera);color:var(--bandera)}
.nota-txt{font-size:14.5px;color:var(--cal);line-height:1.45;margin:8px 0 0}
details.campo-editor{background:var(--verde);border-radius:9px;padding:11px;margin-bottom:8px}
details.campo-editor summary{font-weight:700;font-size:16.5px;cursor:pointer;list-style:none}
details.campo-editor summary::-webkit-details-marker{display:none}
details.campo-editor summary::before{content:"▸ ";color:var(--laton)}
details.campo-editor[open] summary::before{content:"▾ "}
.hoyos-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;margin-top:9px}
.hoyos-grid input{padding:6px 2px;text-align:center;font-family:var(--mono);font-size:15px}
.hoyos-grid .h{font-family:var(--mono);font-size:11px;text-align:center;color:var(--cal)}

/* ---------- Foto de la tarjeta ---------- */
.foto-zona{background:var(--verde);border:1.5px dashed var(--verde-linea);border-radius:var(--r);
  padding:26px 16px;text-align:center;margin-bottom:11px}
.foto-zona p{margin:9px 0 0;font-size:14.5px;color:var(--cal);line-height:1.45}
.foto-prev{width:100%;border-radius:var(--r);display:block;margin-bottom:10px;border:1px solid var(--verde-linea)}
.foto-acc{display:flex;gap:8px;margin-bottom:11px}
.foto-acc button{flex:1;padding:11px;border-radius:9px;font-size:15.5px;font-weight:700}
.cargando{display:flex;align-items:center;gap:9px;justify-content:center;font-family:var(--mono);
  font-size:14px;color:var(--laton);padding:14px}
.spin{width:15px;height:15px;border:2px solid var(--verde-linea);border-top-color:var(--laton);
  border-radius:50%;animation:gira .8s linear infinite;flex:none}
@keyframes gira{to{transform:rotate(360deg)}}
table.rev td.inp{padding:0;min-width:34px}
table.rev td.inp input{width:100%;padding:7px 1px;text-align:center;font-family:var(--mono);font-size:15px;
  font-weight:600;border:none;border-radius:0;background:transparent;color:var(--tinta)}
table.rev td.inp input:focus{outline:2px solid var(--laton);outline-offset:-2px;background:#FFF9E8}
table.rev td.inp input::placeholder{color:#C4BAA2}
textarea.codigo{width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--verde-linea);
  background:var(--verde);color:var(--tarjeta);font-family:var(--mono);font-size:15px;min-height:78px;
  resize:vertical;-webkit-appearance:none}
textarea.codigo:focus{outline:2px solid var(--laton);outline-offset:1px}
.ok-msg{background:#EDF6F0;border:1px solid #BFDCCB;border-left:3px solid var(--ok);border-radius:8px;
  padding:11px 13px;font-size:14.5px;color:#245C3E;margin-bottom:10px}
.err{background:#FDF0EC;border:1px solid #E2C6BD;border-left:3px solid var(--bandera);border-radius:8px;
  padding:11px 13px;font-size:14.5px;color:#8F2C1A;margin-bottom:10px}


/* ---- portada de arranque: 2 s y se desvanece sola ---- */
#portada{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:0;background:
  radial-gradient(120% 90% at 50% 30%, #343841 0%, var(--verde) 46%, var(--verde-hondo) 100%);
  animation:portada-fuera .5s ease 2s forwards;pointer-events:none}
#portada .p-marca{width:92px;height:92px;margin-bottom:26px;opacity:0;
  animation:portada-sube .7s cubic-bezier(.2,.7,.3,1) .05s forwards}
#portada .p-sobre{font-family:var(--mono);font-size:12px;letter-spacing:.42em;text-indent:.42em;
  color:var(--laton);text-transform:uppercase;margin-bottom:14px;opacity:0;
  animation:portada-sube .7s ease .25s forwards}
#portada h1{margin:0;font-size:44px;line-height:1.04;font-weight:800;letter-spacing:-.02em;
  color:var(--tarjeta);text-align:center;text-transform:uppercase;opacity:0;
  animation:portada-sube .7s cubic-bezier(.2,.7,.3,1) .15s forwards}
#portada .p-anio{font-family:var(--mono);font-size:30px;font-weight:700;color:var(--laton);
  letter-spacing:.34em;text-indent:.34em;margin-top:10px;opacity:0;
  animation:portada-sube .7s ease .3s forwards}
#portada .p-raya{width:54px;height:1px;background:var(--laton);opacity:0;margin:22px 0 14px;
  animation:portada-raya .6s ease .45s forwards}
#portada .p-pie{font-family:var(--mono);font-size:12.5px;letter-spacing:.24em;text-indent:.24em;
  color:var(--cal);text-transform:uppercase;opacity:0;animation:portada-sube .7s ease .5s forwards}
#portada .p-jug{font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:.18em;text-indent:.18em;
  color:var(--tarjeta);text-transform:uppercase;margin-top:12px;opacity:0;
  animation:portada-sube .7s ease .6s forwards}
#portada .p-veces{font-family:var(--mono);font-size:11px;letter-spacing:.03em;line-height:1.8;
  color:var(--cal);margin-top:12px;max-width:330px;text-align:center;padding:0 14px;opacity:0;
  animation:portada-sube .7s ease .7s forwards}
#portada .p-ver{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-indent:.14em;
  color:var(--cal);margin-top:14px;opacity:0;animation:portada-sube .7s ease .8s forwards}
@keyframes portada-sube{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes portada-raya{from{opacity:0;transform:scaleX(0)}to{opacity:.9;transform:none}}
@keyframes portada-fuera{to{opacity:0;visibility:hidden}}

/* ---- primera vez: elegir quién eres ---- */
#quien{position:fixed;inset:0;z-index:90;background:var(--verde-hondo);display:flex;
  flex-direction:column;align-items:center;justify-content:center;padding:24px;overflow-y:auto}
#quien h2{margin:0 0 4px;font-size:26px;font-weight:800;color:var(--tarjeta);
  text-transform:uppercase;letter-spacing:-.01em}
#quien p{margin:0 0 16px;font-family:var(--mono);font-size:12.5px;color:var(--cal);
  letter-spacing:.08em;text-align:center;line-height:1.5}
#quien .btn{max-width:340px;width:100%;margin-top:8px}

  flex-direction:column;align-items:center;justify-content:center;padding:26px;text-align:center;overflow-y:auto}
#instalar h2{margin:0 0 4px;font-size:26px;font-weight:800;color:var(--tarjeta);text-transform:uppercase;letter-spacing:-.01em}

#instalar .inst-paso{background:var(--verde);border:1px solid var(--verde-linea);border-radius:var(--r);
  padding:16px;margin-bottom:10px;font-size:19px;color:var(--tarjeta);width:100%;max-width:340px;line-height:1.5}

#instalar .inst-paso small{color:var(--cal);font-size:13.5px}

  border-radius:7px;color:var(--laton);font-size:16px;vertical-align:middle}
#instalar .btn{max-width:340px;width:100%}

<script>
/* La portada solo se muestra una vez por pestaña: las recargas del modo
   en vivo (cada publicación recarga la vista) entran directo al marcador. */
try{
  if(sessionStorage.getItem('santafe-visto')){ const p=document.getElementById('portada'); p&&p.remove(); }
  else sessionStorage.setItem('santafe-visto','1');
}catch(e){}
/* ============================================================
   1. DATOS DEL TORNEO
   ============================================================ */
const DIAS = 2, HOYOS = 18, NJUG = 3;
const VERSION = 11;   // sube al cambiar datos base: dispara migrar()
const ACTUALIZADA='v11 · 13 sep 2026 · 20:53';   // lo sella el script de despliegue en cada publicación

/* --- Los 3 jugadores --- */
/* Índices de handicap del torneo (ajuste vs promedio del grupo tras 2 rondas,
   25-ago pm; aplican a todo el torneo). Se pueden editar en Ajustes. */
const INDICES_2026 = { j0:6, j1:6, j2:16 };   /* handicaps dictados por Paulino */
const JUGADORES = [   /* en orden j0..j2 */
  'Juan Pablo Fernández Mora',
  'José Eduardo Castro Moreno',
  'Rodrigo Galván Jr'
];

/* --- Primer grupo fijo del día 1 (grupo 1) ---
   Los tres, siempre juntos: no hay rotación que resolver.
   Paulino va siempre al final de cualquier lista.                    */
const PRIMER_GRUPO = ['j0','j1','j2'];

/* Cerrado un día de juego (pasada su fecha), sus scores quedan de solo
   consulta: únicamente este teléfono captura correcciones. El candado
   frena la CAPTURA local — la sincronización siempre fusiona, para que
   esas correcciones bajen a todos los teléfonos. */
const EDITOR_CIERRE = 'j0';

/* Quien va SIEMPRE al final del renglón de su grupo. En el verde es Paulino
   (j0): su teléfono es el que anota y lo quiere hasta abajo. Vacío = sin
   reacomodo, el grupo se dibuja en el orden del calendario. */
const AL_FINAL = '';

/* --- Los 4 campos ---
   Los cuatro con par y SI de tarjeta real; EagleVail verificado el
   28-ago-2026 contra 18Birdies y GolfLink (par 35/36, azules 70.7/133) */
const CAMPOS = [
  { nombre:'Santa Fe Social Club', sede:'Xochitepec, Morelos · km 112.5 autopista', fecha:'Sáb 12 sep',
    iso:'2026-09-12', salidas:['9:00 · por el 6'], tee:'Azul 6966', rating:73.1, slope:123, verificado:false,
    par:[4,5,3,4,4,3,5,4,4,4,4,3,5,4,5,4,3,4],
    si :[17,3,13,1,5,15,9,7,11,12,8,16,4,6,2,10,18,14] },

  { nombre:'Santa Fe Social Club', sede:'Xochitepec, Morelos · km 112.5 autopista', fecha:'Dom 13 sep',
    iso:'2026-09-13', salidas:['8:00 · por el 6'], tee:'Azul 6966', rating:73.1, slope:123, verificado:false,
    par:[4,5,3,4,4,3,5,4,4,4,4,3,5,4,5,4,3,4],
    si :[17,3,13,1,5,15,9,7,11,12,8,16,4,6,2,10,18,14] }
];

/* --- VER EL TORNEO EN VIVO (opcional) ---
   Pega aquí la URL de tu Realtime Database de Firebase y reenvía el
   archivo al grupo: todos verán el avance en línea sin configurar nada.
   Gratis en console.firebase.google.com → Realtime Database.
   Ejemplo: 'https://pacos-inv-default-rtdb.firebaseio.com'            */
const SYNC_URL_EMBEBIDA = 'https://paulinofo.pythonanywhere.com';                    // p.ej. 'https://poli.tudominio.com'
const SYNC_TOKEN_EMBEBIDO = '9eb0b306ada4cdd025982f97f18c0da3';                  // el mismo TORNEO_TOKEN del servidor
const SYNC_SALA = 'invitacional-santafe';

function estadoInicial(){
  return {
    version:VERSION,
    torneo:{ nombre:"Santa Fe 2026", formato:'stableford', usarHcp:true, esquema:'convivencia' },
    ia:{ key:'', modelo:'claude-sonnet-5' },
    sync:{ url:SYNC_URL_EMBEBIDA, token:SYNC_TOKEN_EMBEBIDO, sala:SYNC_SALA,
           activo:!!SYNC_URL_EMBEBIDA },
    pend:[], ct:{},
    jugadores: JUGADORES.map((n,i)=>({ id:'j'+i, nombre:n, indice:INDICES_2026['j'+i]??15, corto:'' })),
    campos: CAMPOS.map(c=>({...c, par:[...c.par], si:[...c.si]})),
    grupos:null, scores:{},
    diaActivo:0, grupoActivo:0, hoyoActivo:0, vista:'hoy'
  };
}
let S = estadoInicial();

const LLAVE='invitacional-santafe';
let memoria=null;
function guardar(){ const t=JSON.stringify(S); try{ localStorage.setItem(LLAVE,t); }catch(e){ memoria=t; } }
function cargar(){
  try{ const t=localStorage.getItem(LLAVE)||memoria; if(t) S=Object.assign(estadoInicial(),JSON.parse(t)); }
  catch(e){}
  if(S.version!==VERSION){ migrar(); S.version=VERSION; }
  if(!S.sliding) S.sliding={};
  if(!S.lista) S.lista=LISTA_SLIDING.map(x=>({n:x.n,v:x.v,nota:x.nota||''}));
  if(!S.sync) S.sync={url:'',token:'',sala:SYNC_SALA,activo:false};
  if(S.sync.token===undefined) S.sync.token='';
  if(SYNC_TOKEN_EMBEBIDO && !S.sync.token) S.sync.token=SYNC_TOKEN_EMBEBIDO;
  if(!S.pend) S.pend=[]; if(!S.ct) S.ct={}; if(!S.extras) S.extras={};
  /* nombre corto editable; vacio = el automatico de corto() */
  S.jugadores.forEach(j=>{ if(j.corto===undefined) j.corto=''; });
  if(SYNC_URL_EMBEBIDA && !S.sync.url){ S.sync.url=SYNC_URL_EMBEBIDA; S.sync.activo=true; }
  if(!S.grupos) S.grupos=gruposFijando(S.torneo.esquema);
  sembrar();
  if(S.vista==='sliding') S.vista='presiones';
  if(S.vista==='foto') S.vista='grupos';
  if(!MUESTRA_DINERO && S.vista==='presiones') S.vista='hoy';
  if(S.idxSem!==1){
    /* defaults de generaciones anteriores; una edición manual distinta se respeta */
    const prevIdx={};
    S.jugadores.forEach(j=>{ const v=INDICES_2026[j.id]; if(v===undefined) return;
      if(j.indice===15 || (prevIdx[j.id]||[]).includes(j.indice)) j.indice=v; });
    S.idxSem=1; guardar();
  }
  // Al abrir, salta al día que corresponde a la fecha de hoy
  const d=new Date();                       // fecha LOCAL, no UTC
  const hoy=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')
              +'-'+String(d.getDate()).padStart(2,'0');
  const i=S.campos.findIndex(c=>c.iso===hoy);
  if(i>=0) S.diaActivo=i;
}

/* Actualiza una app ya instalada sin perder los golpes capturados */
function migrar(){
  S.torneo.nombre = "Santa Fe 2026";
  /* nombre e indice oficiales se refrescan; el corto escrito a mano se conserva */
  S.jugadores = JUGADORES.map((n,i)=>{ const v=(S.jugadores||[]).find(j=>j.id==='j'+i);
    return { id:'j'+i, nombre:n, indice:INDICES_2026['j'+i]??15, corto:(v&&v.corto)||'' }; });
  if(S.yo && !S.jugadores.find(j=>j.id===S.yo)) delete S.yo;
  S.grupos = gruposFijando(S.torneo.esquema);
  // Los campos son datos de referencia: se refrescan siempre, los golpes no se tocan
  S.campos = CAMPOS.map(x=>({...x, par:[...x.par], si:[...x.si]}));
  guardar();
}

/* ============================================================
   2. UN SOLO GRUPO
   En Santa Fe son tres y juegan juntos los dos días, así que no
   hay nada que repartir: los dos calendarios son el mismo grupo.
   La maquinaria de rotación sigue ahí para las otras ediciones;
   aquí no tiene trabajo, y la app oculta el selector de grupos y
   el editor de calendario.
   ============================================================ */
function combinaciones(arr,k){
  const res=[];
  (function rec(ini,act){
    if(act.length===k){ res.push([...act]); return; }
    for(let i=ini;i<arr.length;i++){ act.push(arr[i]); rec(i+1,act); act.pop(); }
  })(0,[]);
  return res;
}
/* Un trío fijo los dos días: ambos esquemas son el mismo grupo.
   Se conservan los dos para no tocar la maquinaria compartida. */
const CALENDARIOS = {
  convivencia: [[[0,1,2]], [[0,1,2]]],
  equilibrio:  [[[0,1,2]], [[0,1,2]]]
};
function generarGrupos(esquema='convivencia'){
  const cal = CALENDARIOS[esquema] || CALENDARIOS.convivencia;
  return cal.map(dia=>dia.map(g=>g.map(i=>'j'+i)));
}

/* Remapea el calendario para que el día 1 grupo A sean los cuatro
   que ya quedaron acordados, sin tocar la garantía de no repetir.  */
function gruposFijando(esquema,barajar){
  const base=generarGrupos(esquema);
  let a=[...PRIMER_GRUPO];
  let b=S.jugadores.map(j=>j.id).filter(id=>!a.includes(id));
  if(barajar){ a=revolver(a); b=revolver(b); }
  const mapa={};
  base[0][0].forEach((id,i)=>mapa[id]=a[i]);
  (base[0][1]||[]).forEach((id,i)=>mapa[id]=b[i]);
  return base.map(dia=>dia.map(g=>{
    const m=g.map(id=>mapa[id]);
    return AL_FINAL ? [...m.filter(id=>id!==AL_FINAL), ...m.filter(id=>id===AL_FINAL)] : m;
  }));
}
/* Selector de grupos del dia. Se dibuja desde S.grupos, no de dos botones
   cableados: con un solo grupo (cuatro jugadores, una sola salida) no aparece,
   en vez de dejar un boton muerto que apunta a un grupo inexistente.
   Con dos grupos devuelve exactamente el mismo HTML de antes.  */
function selectorGrupos(d,c){
  const gs=S.grupos[d]||[];
  if(gs.length<2) return '';
  const bot=gs.map((g,i)=>
    `<button class="${S.grupoActivo===i?'on':''}" onclick="setGrupo(${i})">Grupo ${i+1}`
    + (c&&c.salidas&&c.salidas[i]?` · ${esc(c.salidas[i])}`:'') + '</button>'
  ).join('\n      ');
  return '\n    <div class="segm">\n      ' + bot + '\n    </div>';
}
function revolver(arr){
  const c=[...arr];
  for(let i=c.length-1;i>0;i--){ const k=Math.floor(Math.random()*(i+1)); [c[i],c[k]]=[c[k],c[i]]; }
  return c;
}

/* ============================================================
   3. HANDICAP Y PUNTUACIÓN
   ============================================================ */
const jug = id => S.jugadores.find(j=>j.id===id);
const parTotal = c => c.par.reduce((a,b)=>a+b,0);

/* Identidad de ESTE teléfono: pinta la portada con su nombre y centra las
   presiones en él. Se elige la primera vez y se cambia en Ajustes; vive solo
   en el teléfono (no viaja en la sincronización). */
const YO=()=>S.yo||'j0';
const hoyISO=()=>{ const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const diaCerrado=d=>{ const c=S.campos[d]; return !!(c&&c.iso&&c.iso<hoyISO()); };
const puedeEditar=d=>!diaCerrado(d)||YO()===EDITOR_CIERRE;
function setYo(id){
  if(!jug(id)) return;
  S.yo=id; guardar();
  const q=document.getElementById('quien'); q&&q.remove();
  pintarPortadaNombre(); render();
  mostrarInstalador();
}
/* ============================================================
   GUÍA DE INSTALACIÓN — en iPhone no existe instalar con un
   toque (Apple exige Compartir → Añadir a pantalla de inicio),
   así que la app guía el gesto con pasos gigantes y deja de
   insistir cuando confirman que quedó (o al detectar que ya
   corre desde la pantalla de inicio).
   ============================================================ */
const enPantallaInicio=()=>{
  try{
    if(navigator.standalone===true) return true;
    if(window.matchMedia&&matchMedia('(display-mode: standalone)').matches) return true;
  }catch(e){}
  return false;
};
function mostrarInstalador(){
  if(S.instalada||enPantallaInicio()||document.getElementById('instalar')) return;
  const div=document.createElement('div'); div.id='instalar';
  div.innerHTML='<h2>Déjala instalada</h2>'
    +'<p class="inst-sub">para abrirla como app, con su propio icono</p>'
    +'<div class="inst-paso"><b>0</b> · ¿La abriste desde WhatsApp?<br>'
    +'<small>toca el icono de <b>Safari</b> (la brújula, abajo a la derecha) para pasarla a Safari — solo ahí se puede instalar</small></div>'
    +'<div class="inst-paso"><b>1</b> · Toca el botón <span class="inst-ic">⬆︎</span> <b>Compartir</b><br>'
    +'<small>el cuadrito con la flecha, en la barra de Safari</small></div>'
    +'<div class="inst-paso"><b>2</b> · Elige <b>&ldquo;Añadir a pantalla de inicio&rdquo;</b><br>'
    +'<small>desliza el menú hacia abajo si no lo ves</small></div>'
    +'<button class="btn" onclick="instalarListo()">Ya quedó ✓</button>'
    +'<button class="btn sec" onclick="instalarLuego()">Al rato</button>';
  document.body.appendChild(div);
}
function instalarListo(){ S.instalada=true; guardar(); const d=document.getElementById('instalar'); d&&d.remove(); }
function instalarLuego(){ const d=document.getElementById('instalar'); d&&d.remove(); }
function pintarPortadaNombre(){
  const el=document.getElementById('p-jugador');
  if(el&&S.yo&&jug(S.yo)) el.textContent=jug(S.yo).nombre;
  /* cuántas veces juega este teléfono con cada compañero, según el rol */
  const pv2=document.getElementById('p-veces');
  if(pv2&&S.yo&&S.grupos){
    const c={};
    for(const dia of S.grupos){
      const g=(dia||[]).find(x=>x.includes(S.yo)); if(!g) continue;
      g.forEach(r=>{ if(r!==S.yo) c[r]=(c[r]||0)+1; });
    }
    pv2.textContent=S.jugadores.filter(j=>j.id!==S.yo)
      .map(j=>nom1(j)+' '+(c[j.id]||0)).join(' · ');
  }
  const pv=document.getElementById('p-version');
  if(pv) pv.textContent=ACTUALIZADA;
}
function mostrarQuien(){
  if(document.getElementById('quien')) return;
  const div=document.createElement('div'); div.id='quien';
  div.innerHTML='<h2>¿Quién eres?</h2><p>Para tu pantalla de inicio y tus presiones<br>en este teléfono</p>'
    +S.jugadores.map(j=>'<button class="btn sec" onclick="setYo(\''+j.id+'\')">'+esc(j.nombre)+'</button>').join('');
  document.body.appendChild(div);
}
function hcpCampo(j,c){
  if(!S.torneo.usarHcp) return 0;
  return Math.round(parseFloat(j.indice)||0);   // un solo indice para los cuatro campos
}
function golpesEnHoyo(ch,si){
  if(ch===0) return 0;
  if(ch<0){                                  // jugador "plus": devuelve golpes
    const p=-ch;
    return -(Math.floor(p/18)+(si>18-(p%18)?1:0));
  }
  return Math.floor(ch/18)+(si<=(ch%18)?1:0);
}
function scoreDe(d,jid,h){ const r=S.scores['d'+d]; if(!r||!r[jid]) return null;
  const v=r[jid][h]; return (v===null||v===undefined)?null:v; }
function fijarScore(d,jid,h,v,tRemoto){
  const k='d'+d;
  if(!S.scores[k]) S.scores[k]={};
  if(!S.scores[k][jid]) S.scores[k][jid]=Array(HOYOS).fill(null);
  S.scores[k][jid][h]=v;
  const llave=d+'.'+jid+'.'+h;
  if(tRemoto){ S.ct[llave]=tRemoto; }
  else{
    S.ct[llave]=Date.now();
    if(sincronizando()){
      S.pend.push({d,jid,h,v,t:S.ct[llave]});
      if(S.pend.length>2000) S.pend=S.pend.slice(-1500);
      programarSync();
    }
    artProgramar();
  }
  guardar();
}
const puntosStableford=(neto,par)=>Math.max(0,2-(neto-par));

/* ---------- Basura: birdies automáticos, sandies y oyeses a mano ----------
   $1 la unidad; se paga la diferencia contra cada rival del grupo.
   Viajan como celdas con jid 'jN.x' (los clientes viejos las ignoran). */
const VALOR_UNIDAD = 1;
function extraDe(d,jid,h){ return ((S.extras||{})[d+'.'+jid+'.'+h])|0; }   // bit0 sandy · bit1 1º del oyes · bits2-4 posición
/* posición en el oyes: 1 = el más cercano. Los datos viejos solo traían el
   bit del ganador, así que valen como 1º. */
function ordenOyes(d,jid,h){ const x=extraDe(d,jid,h), n=(x>>2)&7; return n||((x&2)?1:0); }
function fijarExtra(d,jid,h,bits,tRemoto){
  if(!S.extras) S.extras={};
  const llave=d+'.'+jid+'.'+h; bits=bits|0;
  if(bits) S.extras[llave]=bits; else delete S.extras[llave];
  const ck='x.'+llave;
  if(tRemoto){ S.ct[ck]=tRemoto; }
  else{
    S.ct[ck]=Date.now();
    if(sincronizando()){
      S.pend.push({d,jid:jid+'.x',h,v:bits,t:S.ct[ck]});
      if(S.pend.length>2000) S.pend=S.pend.slice(-1500);
      programarSync();
    }
    artProgramar();
  }
  guardar();
}
/* ---------- Castigos de la ronda: OB (+2) y hazard (+1) ----------
   Al marcarlos suman los golpes al hoyo en el acto; al desmarcarlos los
   quitan. La marca se guarda con los demas extras (bits 5 y 6) y viaja en
   la sincronizacion, pero el telefono que la RECIBE no vuelve a sumar: el
   score que le llega ya trae el castigo. Asi dos telefonos marcando el
   mismo OB tampoco lo cuentan doble. */
/* Cada castigo es un CONTADOR de dos bits, porque en un mismo hoyo se puede
   pegar mas de una vez fuera o al agua: OB en los bits 5-6 y hazard en los
   7-8 (0 a 3 cada uno), y el bit 9 recuerda si fue un castigo el que abrio
   el hoyo. Cada toque suma uno; pasado el tope vuelve a cero y devuelve
   todos los golpes. */
const PENALES = [ {desp:5, golpes:2, et:'⛔ OB'}, {desp:7, golpes:1, et:'💧 hazard'} ];
const TOPE_PENAL = 3;
const MASCARA_PENAL = 480;                      // los cuatro bits de los dos contadores
const cuentaPenal=(x,desp)=>(x>>desp)&3;
function ciclaPenal(jid,desp,golpes){
  const d=S.diaActivo, h=S.hoyoActivo;
  if(!puedeEditar(d)) return;
  const x=extraDe(d,jid,h), g=scoreDe(d,jid,h);
  const n=cuentaPenal(x,desp), n2=(n+1)%(TOPE_PENAL+1);
  const dif=(n2-n)*golpes;                      // golpes que entran (o salen, si dio la vuelta)
  let nx=(x & ~(3<<desp)) | (n2<<desp);
  if(g===null){                                 // hoyo vacio: el castigo lo abre en par + lo suyo
    nx|=512;
    fijarScore(d,jid,h, Math.min(15, S.campos[d].par[h]+dif));
  }else if(!(nx&MASCARA_PENAL) && (x&512)){     // se fue el ultimo castigo y el hoyo lo abrio el:
    fijarScore(d,jid,h,null); nx&=~512;         // vuelve a quedar VACIO, sin pares fantasma
  }else{
    fijarScore(d,jid,h, Math.max(1, Math.min(15, g+dif)));
  }
  fijarExtra(d,jid,h,nx);
  render();
}
function toggleExtra(jid,bit){
  const d=S.diaActivo, h=S.hoyoActivo;
  if(!puedeEditar(d)) return;
  fijarExtra(d,jid,h,extraDe(d,jid,h)^bit);
  render();
}
/* Oyes por orden de cercanía: cada toque mete al jugador al final de la
   fila (1º, 2º, 3º…) y tocarlo de nuevo lo saca y renumera a los demás.
   La unidad se la lleva el 1º; el otro grupo lleva su propia fila. */
function cicloOyes(jid){
  const d=S.diaActivo, h=S.hoyoActivo;
  if(!puedeEditar(d)) return;
  const g=(S.grupos[d]||[]).find(z=>z.includes(jid))||[jid];
  let fila=g.filter(o=>ordenOyes(d,o,h)>0).sort((a,b)=>ordenOyes(d,a,h)-ordenOyes(d,b,h));
  if(ordenOyes(d,jid,h)>0) fila=fila.filter(o=>o!==jid);
  else fila.push(jid);
  g.forEach(o=>{
    const pos=fila.indexOf(o)+1, x=extraDe(d,o,h);
    const nuevo=(x&1)|(x&992)|(pos===1?2:0)|(pos<<2);   // &992 conserva los contadores de castigos y su bandera
    if(nuevo!==x) fijarExtra(d,o,h,nuevo);
  });
  render();
}
function unidadesRonda(d,jid){
  /* blindado: un dato raro degrada a 0 unidades, jamás tumba la vista */
  try{
    const c=S.campos[d]; let b=0,s=0,o=0;
    for(let h=0;h<HOYOS;h++){
      const g=scoreDe(d,jid,h), x=extraDe(d,jid,h);
      if(g===null) continue;                    // hoyo sin capturar (o borrado): nada cuenta
      const df=g-c.par[h];
      if(df===-1) b+=1; else if(df<=-2) b+=2;
      if((x&1) && g<=c.par[h]) s++;             // el sandy exige par o mejor
      if(x&2) o++;
    }
    return {b,s,o,total:b+s+o};
  }catch(e){ return {b:0,s:0,o:0,total:0}; }
}
/* dinero del día con basura incluida (el rodado del sliding usa solo el match) */
function dineroConBasura(d,a,b){
  const m=dineroMatch(d,a,b); if(m===null) return null;
  return m + (unidadesRonda(d,a).total-unidadesRonda(d,b).total)*VALOR_UNIDAD;
}

/* ---------- Parejas: 2v2 por puntos, fijas los 18, 5-5-10 ----------
   Cada hoyo reparte hasta DOS puntos (regla 31-ago, estilo P&C):
   uno por la MEJOR BOLA y otro por el TOTAL COMBINADO de la pareja —
   así la bola del compañero siempre cuenta, aunque el otro haya hecho
   birdie. Empate en un rubro, punto sin dueño. Cada apuesta abre su
   presión al llegar a 3, que a su vez abre la suya (cadena).
   La ventaja se pacta POR PAREJA en el tee (v: + = la pareja 1 le da
   a la 2; cae por dificultad y descuenta una vez a la mejor bola y una
   vez al total) y el dinero del match se reparte entre los dos
   integrantes según PAREJAS_DIVIDE. Config por teléfono, como los
   pactos del sliding.
   Solo aparece en grupos de 4. */
function cfgParejas(d){
  if(!S.parejas) S.parejas={};
  if(!S.parejas[d]) S.parejas[d]={sel:0,v:PAREJAS_VENTAJA,quien:''};
  return S.parejas[d];
}
function particiones(g){
  return [[[g[0],g[1]],[g[2],g[3]]],
          [[g[0],g[2]],[g[1],g[3]]],
          [[g[0],g[3]],[g[1],g[2]]]];
}
function setParejaSel(i){ cfgParejas(S.diaActivo).sel=i|0; guardar(); render(); }
function setQuienParejas(jid){ cfgParejas(S.diaActivo).quien=jid; guardar(); render(); }
function ajustaVentajaParejas(n){
  const c=cfgParejas(S.diaActivo);
  c.v=Math.max(-36,Math.min(36,(c.v|0)+n));
  guardar(); render();
}
function matchParejas(d,hasta){
  if(hasta===undefined) hasta=17;
  try{
    const gs=S.grupos[d]||[];
    const g=gs.find(z=>z.includes(YO()))||gs[0];
    if(!g||g.length!==4) return null;
    const cfg=cfgParejas(d), c=S.campos[d];
    const par2=particiones(g)[cfg.sel|0]||particiones(g)[0];
    const pa=par2[0], pb=par2[1];
    const bolas=(par,h)=>par.map(j2=>scoreDe(d,j2,h)).filter(x=>x!==null);
    const v=cfg.v|0;
    const gr=(par,h)=>{ const recibe=(par===pa)?(v<0?-v:0):(v>0?v:0);
      return recibe?golpesEnHoyo(recibe,c.si[h]):0; };
    /* ventaja cargada a un solo jugador: cual pareja recibe y quien de ella */
    const unJugador = PAREJAS_REGLAS.ventaja==='jugador' && v!==0;
    const recibePar = !unJugador ? null : (v>0?pb:pa);
    const quien = !recibePar ? '' :
      (recibePar.includes(cfg.quien) ? cfg.quien : masAltoDe(recibePar));
    const neto=(par,h)=>{
      if(unJugador){
        const b=par.map(j2=>{ const s=scoreDe(d,j2,h); if(s===null) return null;
          return s-(j2===quien?golpesMitadNueve(v,d,h):0); }).filter(x=>x!==null);
        return b.length?Math.min(...b):null;
      }
      const b=bolas(par,h); if(!b.length) return null;
      return Math.min(...b)-gr(par,h); };
    /* total combinado: solo cuenta con las dos bolas capturadas */
    const total=(par,h)=>{ const b=bolas(par,h); if(b.length!==2) return null;
      return b[0]+b[1]-gr(par,h); };
    const apuestas=[]; const porNueve=[];
    [[0,8,'Ida'],[9,17,'Vuelta']].forEach(([ini,fin,nom])=>{
      let aps=[{et:nom+' · salida',ini,fin,st:0,p:false}];
      apuestas.push(aps[0]);
      let nPres=0;
      for(let h=ini;h<=Math.min(fin,hasta);h++){
        const na=neto(pa,h), nb=neto(pb,h);
        if(na===null||nb===null) continue;
        let r=nb>na?1:(nb<na?-1:0);         // punto de la mejor bola
        if(PAREJAS_REGLAS.puntos>1){        // y el del total combinado, si esta edicion lo juega
          const ta=total(pa,h), tb=total(pb,h);
          if(ta!==null&&tb!==null) r+=tb>ta?1:(tb<ta?-1:0);
        }
        aps.forEach(ap=>{ if(h>=ap.ini) ap.st+=r; });
        const nuevas=[];
        aps.forEach(ap=>{ if(!ap.p&&Math.abs(ap.st)>=3&&h>=ap.ini&&h<fin){
          ap.p=true; nPres++;
          nuevas.push({et:nom+' · presión '+nPres,ini:h+1,fin,st:0,p:false}); } });
        aps=aps.concat(nuevas); nuevas.forEach(x=>apuestas.push(x));
      }
      porNueve.push(aps.reduce((t,ap)=>t+(ap.st>0?1:(ap.st<0?-1:0)),0));
    });
    return {pa,pb,apuestas,porNueve,quien};
  }catch(e){ return null; }
}
function seccionParejas(d){
  const m=matchParejas(d);
  if(!m) return '';
  const cfg=cfgParejas(d);
  const g=(S.grupos[d]||[]).find(z=>z.includes(YO()))||S.grupos[d][0];
  const sg2=x=>x>0?'+'+x:(x<0?''+x:'0');
  const nom2=par=>par.map(j2=>nom1(j2)).join(' y ');
  const sel=particiones(g).map((p2,i)=>
    `<button class="${(cfg.sel|0)===i?'on':''}" onclick="setParejaSel(${i})">${esc(nom2(p2[0]))} vs ${esc(nom2(p2[1]))}</button>`).join('');
  const miLado=m.pa.includes(YO())?1:-1;
  const v=cfg.v|0;
  const vTxt=v===0?'parejas, sin golpes':(v>0
    ? esc(nom2(m.pa))+' dan '+v
    : esc(nom2(m.pb))+' dan '+(-v));
  let ganA=0,ganB=0;
  m.apuestas.forEach(a2=>{ if(a2.st>0)ganA++; else if(a2.st<0)ganB++; });
  const dIda=m.porNueve[0]*VALOR_IDA, dVta=m.porNueve[1]*VALOR_VUELTA;
  const bono=ganA>ganB?BONO_MAYORIA:(ganB>ganA?-BONO_MAYORIA:0);
  const dinero=(dIda+dVta+bono)*miLado;
  const mitad=Math.abs(dinero)/PAREJAS_DIVIDE;
  const filas=m.apuestas.map(a2=>`<div class="cuenta"><span>${esc(a2.et)}</span>
    <span class="${a2.st*miLado>0?'arr':(a2.st*miLado<0?'aba':'')}">${sg2(a2.st*miLado)}</span></div>`).join('');
  const etDinero=`${VALOR_IDA}-${VALOR_VUELTA}-${BONO_MAYORIA} · ${PAREJAS_DIVIDE>1?'se divide':'cada quien'}`;
  return `<div class="grupo" style="margin-top:10px"><h3>Parejas · bola y total <span>${etDinero}</span></h3>
    <div class="segm" style="margin-top:8px;flex-direction:column;align-items:stretch">${sel}</div>
    <div class="cuenta"><span>Ventaja pactada<br><i style="font-style:normal;font-family:var(--mono);font-size:11px;color:var(--tinta-suave)">${vTxt} · ${PAREJAS_REGLAS.ventaja==='jugador'?'mitad en cada nueve':'cae por dificultad'}</i></span>
      <span style="display:inline-flex;align-items:center;gap:7px">
        <button class="bt" style="width:30px;height:30px;font-size:19px" onclick="ajustaVentajaParejas(-1)">−</button>
        <span style="min-width:44px;text-align:center">${sg2(v)}</span>
        <button class="bt" style="width:30px;height:30px;font-size:19px" onclick="ajustaVentajaParejas(1)">+</button>
      </span></div>
    ${!m.quien ? '' : `<div class="cuenta"><span>Los golpes los recibe</span>
      <span class="segm" style="margin:0;padding:3px;gap:3px;width:auto">${(m.pa.includes(m.quien)?m.pa:m.pb).map(j2=>
        `<button class="${m.quien===j2?'on':''}" style="padding:6px 11px;font-size:14.5px" onclick="setQuienParejas('${j2}')">${esc(nom1(j2))}</button>`).join('')}</span></div>`}
    ${filas}
    <div class="cuenta"><span>Ida ${sg2(m.porNueve[0]*miLado)} × ${VALOR_IDA} · Vuelta ${sg2(m.porNueve[1]*miLado)} × ${VALOR_VUELTA} · Match ${bono===0?'—':sg2(bono*miLado)}</span>
      <span class="${dinero>0?'arr':(dinero<0?'aba':'')}">${dinero===0?'—':sg2(dinero)}</span></div>
    <div class="cuenta total"><span>${dinero<0?'Pagan':(dinero>0?'Cobran':'Tablas')} · por cabeza</span>
      <span>${dinero===0?'—':(mitad%1?mitad.toFixed(1):mitad)}</span></div>
    <p class="nota-txt" style="margin-top:6px">${PAREJAS_REGLAS.puntos>1
      ? 'Cada hoyo vale hasta dos puntos: uno por la mejor bola y otro por el total combinado de la pareja — la bola del compañero siempre cuenta.'
      : 'Cada hoyo vale un punto, para la pareja con la mejor bola neta más baja; empate, nadie se lo lleva.'}
    ${PAREJAS_REGLAS.ventaja==='jugador'
      ? 'Los golpes los carga un solo jugador y se parten en mitades, la mitad en cada nueve, sobre los hoyos más difíciles de ese nueve; un número impar deja medio golpe, que rompe los empates a su favor.'
      : ''}
    Cada apuesta abre presión al llegar a 3 y ya no se cierra. La pareja y la ventaja se pactan en el tee y viven en este teléfono.</p>
  </div>`;
}


function resumenRonda(d,jid){
  const c=S.campos[d], ch=hcpCampo(jug(jid),c);
  let bruto=0,neto=0,pts=0,jugados=0;
  for(let h=0;h<HOYOS;h++){
    const g=scoreDe(d,jid,h); if(g===null) continue;
    jugados++; const n=g-golpesEnHoyo(ch,c.si[h]);
    bruto+=g; neto+=n; pts+=puntosStableford(n,c.par[h]);
  }
  return {bruto,neto,pts,jugados,ch};
}
function resumenTotal(jid){
  let bruto=0,neto=0,pts=0,jugados=0; const rondas=[];
  for(let d=0;d<DIAS;d++){ const r=resumenRonda(d,jid); rondas.push(r);
    bruto+=r.bruto; neto+=r.neto; pts+=r.pts; jugados+=r.jugados; }
  return {bruto,neto,pts,jugados,rondas};
}
const esStableford=()=>S.torneo.formato==='stableford';
const valorOrden=r=>esStableford()?-r.pts:(S.torneo.usarHcp?r.neto:r.bruto);

/* ============================================================
   4. VISTAS
   ============================================================ */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* nombre corto para la tarjeta: respeta nombres compuestos (Juan Carlos Zepeda -> Juan Carlos) */
const corto=n=>{const p=String(n??'').trim().split(/\s+/);return p.length>=3?p[0]+' '+p[1]:p[0];};
/* El corto que las vistas REALMENTE usan: manda el que se escribio en Ajustes
   y, si esta vacio, el automatico de arriba. Acepta el id ('j2') o el objeto. */
const jugDe=x=>typeof x==='string'?jug(x):x;
const nom=x=>{const j=jugDe(x);return (j&&String(j.corto||'').trim())||corto(j?j.nombre:'');};
/* Para los lugares muy apretados que se quedaban con la primera palabra: un corto
   escrito a mano ya venia elegido para caber, asi que ese se respeta tal cual. */
const nom1=x=>{const j=jugDe(x);const c=j&&String(j.corto||'').trim();
  return c||corto(j?j.nombre:'').split(' ')[0];};
/* Punto rojo en la esquina de la celda: los golpes que ese jugador recibe
   en ese hoyo segun su indice y el indice de dificultad del hoyo. */
const marcaVentaja=gp=>gp>0?`<i class="tri t${Math.min(gp,3)}" title="${gp} golpe${gp>1?'s':''} de ventaja"></i>`:'';
function claseNota(g,par){
  if(g===null) return '';
  const d=g-par;
  return d<=-2?'eagle':d===-1?'birdie':d===1?'bogey':d>=2?'doble':'';
}
/* ---------- Captura ---------- */
function vistaHoy(){
  const d=S.diaActivo, c=S.campos[d], h=S.hoyoActivo;
  const grupo=S.grupos[d][S.grupoActivo]||S.grupos[d][0];
  const editable=puedeEditar(d);
  let hechos=0;
  S.grupos[d].forEach(g=>g.forEach(jid=>{ for(let i=0;i<HOYOS;i++) if(scoreDe(d,jid,i)!==null) hechos++; }));

  let html=`${selectorGrupos(d,c)}
    <div class="hoyo-nav">
      <button class="flecha" onclick="mueveHoyo(-1)" ${h===0?'disabled':''}>‹</button>
      <div class="hoyo-info">
        <div class="hoyo-num">${h+1}<small> / 18</small></div>
        <div class="hoyo-meta">Par ${c.par[h]} · SI ${c.si[h]}</div>
      </div>
      <button class="flecha" onclick="mueveHoyo(1)" ${h===HOYOS-1?'disabled':''}>›</button>
    </div>`;

  grupo.forEach(jid=>{
    const j=jug(jid), ch=hcpCampo(j,c), gp=golpesEnHoyo(ch,c.si[h]);
    const g=scoreDe(d,jid,h);
    const neto=g===null?null:g-gp;
    const pts=neto===null?null:puntosStableford(neto,c.par[h]);
    const x=extraDe(d,jid,h);
    /* los chips se dibujan siempre: el renglón mide igual con y sin unidades */
    const sandyOk=(g!==null&&g<=c.par[h])||(x&1);
    const chips=`<button class="xtra ${x&1?'on':''}"${sandyOk&&editable?'':' disabled'} onclick="toggleExtra('${jid}',1)">🏖️ sandy</button>`
      +(c.par[h]===3?(()=>{ const pos=ordenOyes(d,jid,h);
          return `<button class="xtra ${pos===1?'on':''}"${editable?'':' disabled'} onclick="cicloOyes('${jid}')">🎯 ${pos?pos+'º':'oyes'}</button>`; })():'');
    const penales=PENALES.map(p=>{ const n=cuentaPenal(x,p.desp);
      return `<button class="xtra pen ${n?'on':''}"${editable?'':' disabled'}
      onclick="ciclaPenal('${jid}',${p.desp},${p.golpes})">${p.et} ${n?'×'+n:'+'+p.golpes}</button>`; }).join('');
    const xtras=`<div class="xtras">${MUESTRA_DINERO?chips:''}${penales}</div>`;
    html+=`<div class="jug-fila">${marcaVentaja(gp)}
      <div class="jug-id">
        <div class="jug-nom">${esc(nom(j))}${gp>0?' <span class="gp-pts">'+'•'.repeat(Math.min(gp,3))+'</span>':''}</div>
        <div class="jug-sub">HCP ${ch}${g!==null?' · neto '+neto:''}</div>
      </div>
      <div class="golpe">
        ${editable?`<button class="bt" onclick="cambiaGolpe('${jid}',-1)">−</button>`:''}
        <div class="marcador ${g===null?'vacio':''}"${editable?` onclick="ponPar('${jid}')"`:''}>
          ${g===null?'–':`<span class="nota ${claseNota(g,c.par[h])}">${g}</span>`}
        </div>
        ${editable?`<button class="bt" onclick="cambiaGolpe('${jid}',1)">+</button>`:''}
      </div>
      <div class="pts">${pts===null?'':(esStableford()?pts+'p':(neto-c.par[h]>0?'+':'')+(neto-c.par[h]))}</div>
      ${xtras}
    </div>`;
  });

  /* ---- presiones en vivo, sólo si tu jugador va en este grupo ---- */
  const MI=YO();
  if(MUESTRA_DINERO && grupo.includes(MI)){
    const nueveFin = h<9?8:17, etNueve = h<9?'la ida':'la vuelta';
    const sg=v=>v>0?'+'+v:(v<0?''+v:'0');
    let filasPH='';
    grupo.filter(id=>id!==MI).forEach(rid=>{
      const m=presionesMatch(d,MI,rid,h);
      const vivas=m.apuestas.filter(a=>a.fin===nueveFin && a.ini<=h);
      const marc=vivas.length

/* ============================================================
   PRESIONES · match play por nueves, presion automatica al 2.
   Cada apuesta lleva su marcador y genera la suya al llegar a
   2 abajo; ninguna se cierra: corren hasta el 9 y hasta el 18.
   ============================================================ */
const VALOR_IDA    = 5;    // cada presion de la ida
const VALOR_VUELTA = 5;    // cada presion de la vuelta
const BONO_MAYORIA = 10;   // el match: para quien acumule mas presiones entre las dos vueltas
/* En cuantas partes se reparte el dinero del juego de PAREJAS: 2 = mitad
   por cabeza (como se jugó en Vail); 1 = cada quien paga completo. */
const PAREJAS_DIVIDE = 2;
/* Ventaja con que arranca el juego de parejas en cada dia: + = la pareja 1
   le da golpes a la 2. Es sólo el valor inicial; cada teléfono la ajusta
   con los botones y su cambio manda. */
const PAREJAS_VENTAJA = 0;
/* Reglas del juego de parejas, que no se juega igual en todas las ediciones.
     puntos  2 = P&C de Plack: un punto por la mejor bola y otro por el total
                 combinado de la pareja (Vail, verde y azul)
             1 = solo la mejor bola (Acapulco)
     ventaja 'pareja'  = los golpes pactados corren por la pareja entera y se
                 reparten por dificultad entre los 18 hoyos (Vail)
             'jugador' = los carga UN jugador de la pareja, y se parten en
                 mitades: la mitad en la ida y la mitad en la vuelta, sobre
                 los hoyos mas dificiles de cada nueve. Un numero impar deja
                 MEDIO golpe en el ultimo hoyo que alcanza, que rompe los
                 empates a favor de quien lo recibe (Acapulco).           */
const PAREJAS_REGLAS = { puntos:2, ventaja:'pareja' };

/* Golpes que recibe en este hoyo quien carga la ventaja del grupo, con la
   regla de mitades. Devuelve 0, 0.5 o entero. */
function golpesMitadNueve(total,d,h){
  const c=S.campos[d], ini=h<9?0:9, fin=ini+9;
  const mitad=Math.abs(total)/2;
  const base=Math.floor(mitad/9), resto=mitad-base*9;
  let rank=1;
  for(let k=ini;k<fin;k++) if(c.si[k]<c.si[h]) rank++;
  let g=base;
  if(rank<=Math.floor(resto)) g+=1;
  else if(rank===Math.floor(resto)+1 && resto%1) g+=0.5;
  return g;
}
/* De los dos de una pareja, el de indice mas alto: por omision es quien
   recibe los golpes del grupo. */
function masAltoDe(par){
  return par.slice().sort((a,b)=>(parseFloat(jug(b).indice)||0)-(parseFloat(jug(a).indice)||0))[0];
}
/* Torneo con dinero (1) o Stableford puro (0). En 0 desaparecen la pestaña
   Presiones -- con su lista de sliding --, los chips de basura y los
   marcadores de apuesta en Hoy. Indispensable cuando el grupo es impar:
   con tres jugadores el juego de parejas 2v2 no cabe. */
const MUESTRA_DINERO = 0;
/* Lista maestra de sliding del grupo.  − da golpes  ·  + los recibe. */
const LISTA_SLIDING = [   /* Stableford puro: no hay golpes pactados */
];
let presRival=null;
/* Handicap deslizante: golpes pactados entre dos jugadores para un dia.
   Positivo = el primero (por id) le da golpes al segundo. */
const sinAcentos=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
/* Liga un jugador con su renglón de la lista. Exige que todos los nombres de uno
   estén dentro del otro (admitiendo diminutivos: Vic → Víctor). Si hay duda, no liga. */
function casaTok(a,b){ return a===b || (a.length>=3 && b.startsWith(a)) || (b.length>=3 && a.startsWith(b)); }
function idxLista(nombre){
  const p=sinAcentos(nombre).split(/\s+/).filter(Boolean); if(!p.length) return -1;
  const cont=(chicos,grandes)=>chicos.every(t=>grandes.some(u=>casaTok(t,u)));
  const c=[];
  S.lista.forEach((e,i)=>{
    const q=sinAcentos(e.n).replace(/\(.*?\)/g,'').split(/\s+/).filter(Boolean);
    if(!q.length) return;
    if(cont(p,q)||cont(q,p)) c.push(i);
  });
  return c.length===1?c[0]:-1;
}
function valorLista(jid){ const i=idxLista(jug(jid).nombre);
  if(i<0) return jid===YO() ? 0 : null;   // tu propio renglón ausente cuenta como 0
  return (parseInt(S.lista[i].v,10)||0); }
/* Golpes dictados por pareja ('ja|jb' ordenado: los que el primero le da al
   segundo; negativo = los recibe). Le ganan a la diferencia de la lista;
   un pacto del tee les gana a ellos, solo ese día. */
/* Los pares de Paulino van fijos aquí, no en la lista: su lista está editada
   solo en su teléfono y los demás calculaban distinto contra él (los que no
   figuran en LISTA_SLIDING se evaluaban como cero). Con el mapa todos ven lo
   mismo; un pacto del tee sigue ganando ese día. */
const SLIDING_PAREJAS = {};
/* Golpes que 'a' le da a 'b': el pacto de la pareja si existe;
   si no, la diferencia de valores de la lista. */
function slidingLista(a,b){
  const o=[a,b].slice().sort(), k=o.join('|');
  if(k in SLIDING_PAREJAS){ const v=SLIDING_PAREJAS[k]; return o[0]===a?v:-v; }
  const va=valorLista(a), vb=valorLista(b);
  return (va===null||vb===null)?null:(vb-va); }
function setLista(i,campo,val){
  if(campo==='v') S.lista[i].v=Math.max(-36,Math.min(36,parseInt(val,10)||0));
  else S.lista[i][campo]=val;
  guardar(); render();
}
function agregaLista(){ S.lista.push({n:'',v:0,nota:''}); guardar(); render(); }
function borraLista(i){ S.lista.splice(i,1); guardar(); render(); }
function dejarParejos(d){
  const mi=YO();
  const g=(S.grupos[d]||[]).find(x=>x.includes(mi)); if(!g) return;
  g.filter(id=>id!==mi).forEach(rid=>setSliding(d,mi,rid,0));
}
function aplicaListaAlDia(d){
  const mi=YO();
  const g=(S.grupos[d]||[]).find(x=>x.includes(mi)); if(!g) return;
  g.filter(id=>id!==mi).forEach(rid=>{ const v=slidingLista(mi,rid); if(v!==null) setSliding(d,mi,rid,v); });
}
const claveSl=(d,a,b)=>d+'|'+[a,b].slice().sort().join('|');
/* Golpes que 'a' le da a 'b' ese día (negativo = los recibe).
   La regla aplica sola cada día que juegas y va RODANDO: la primera vez
   que dos se topan rigen las ventajas de la lista; la siguiente vez, lo
   del juego anterior movido un golpe — el que perdió recibe uno más, el
   que ganó lo da, y en tablas queda igual. Un pacto del tee — incluso
   "parejos" (0) — le gana a la regla, solo ese día, y el rodado siguiente
   parte del pacto. */
function slidingDe(d,a,b){
  const k=claveSl(d,a,b);
  if(S.sliding && k in S.sliding){
    const v=S.sliding[k];
    return [a,b].slice().sort()[0]===a ? v : -v;
  }
  return slidingRodado(d,a,b);
}
/* De dónde sale la ventaja de hoy con ese rival: qué tenías el día
   anterior y cómo te fue — el chip de al lado ya dice con qué juegas hoy */
function motivoSliding(d,a,b){
  const k=claveSl(d,a,b);
  if(S.sliding && k in S.sliding) return 'pactado ese día';
  for(let p=d-1;p>=0;p--){
    const g=(S.grupos[p]||[]).find(x=>x.includes(a)&&x.includes(b));
    if(!g) continue;
    const din=dineroMatch(p,a,b);
    if(din===null) continue;
    const et=String(S.campos[p].fecha).split(' ')[0].toLowerCase();
    const prev=slidingDe(p,a,b);
    const tenias=prev<0?'te daba '+(-prev):(prev>0?'le dabas '+prev:'parejos');
    return 'el '+et+': '+tenias+' · '+(din<0?'perdiste':(din>0?'ganaste':'tablas'));
  }
  return 'según la lista';
}
function slidingRodado(d,a,b){
  /* último día previo en que 'a' y 'b' jugaron juntos con golpes capturados */
  for(let p=d-1;p>=0;p--){
    const g=(S.grupos[p]||[]).find(x=>x.includes(a)&&x.includes(b));
    if(!g) continue;
    const din=dineroMatch(p,a,b);
    if(din===null) continue;            // jugaron juntos pero sin capturar: sigue atrás
    const prev=slidingDe(p,a,b);
    if(din<0) return prev-1;            // 'a' perdió: recibe un golpe más
    if(din>0) return prev+1;            // 'a' ganó: da un golpe más
    return prev;                        // tablas: se queda igual
  }
  const v=slidingLista(a,b);            // nunca se han topado: la lista
  return v===null ? 0 : v;
}
function setSliding(d,a,b,v){
  if(!S.sliding) S.sliding={};
  /* El tope tiene que dar cabida a la diferencia real de la lista: entre los ocho
     del Vail llega a 24 (Paulino -12 contra Paco +12) y en la lista completa a 30.
     Con 18 se guardaba menos de lo que anunciaba la pantalla del tee. */
  v=Math.max(-36,Math.min(36,v|0));
  const k=claveSl(d,a,b);
  /* el 0 se guarda explícito: "pactamos parejos" también le gana a la lista */
  S.sliding[k] = ([a,b].slice().sort()[0]===a) ? v : -v;
  guardar(); render();
}
/* Sugerencia: quien perdio el dia anterior contra ese rival recibe un golpe mas. */
function slidingSugerido(d,a,b){
  if(d===0) return 0;
  const prev=slidingDe(d-1,a,b);
  const m=presionesMatch(d-1,a,b);
  if(!m.apuestas.some(x=>x.hist.some(v=>v!==null))) return prev;
  const din=m.porNueve[0]*VALOR_IDA+m.porNueve[1]*VALOR_VUELTA;
  if(din<0) return prev-1;            // 'a' perdio: recibe un golpe mas
  if(din>0) return prev+1;
  return prev;
}
function presionesMatch(d,jidA,jidB,hasta){
  if(hasta===undefined) hasta=17;
  const c=S.campos[d];
  const sv=slidingDe(d,jidA,jidB);    // + = A le da golpes a B
  const neto=(jid,h)=>{ const g=scoreDe(d,jid,h); if(g===null) return null;
    const recibe = (jid===jidA) ? (sv<0?-sv:0) : (sv>0?sv:0);
    return g - (recibe?golpesEnHoyo(recibe,c.si[h]):0); };
  const apuestas=[]; const porNueve=[];
  [[0,8,'Ida'],[9,17,'Vuelta']].forEach(([ini,fin,nom])=>{
    let aps=[{et:nom+' · salida',ini,fin,st:0,p:false,hist:new Array(18).fill(null)}];
    apuestas.push(aps[0]);
    let nPres=0;
    for(let h=ini;h<=Math.min(fin,hasta);h++){
      const na=neto(jidA,h), nb=neto(jidB,h);
      if(na===null||nb===null) continue;
      const r = na<nb?1:(na>nb?-1:0);
      aps.forEach(ap=>{ if(h>=ap.ini){ ap.st+=r; ap.hist[h]=ap.st; } });
      const nuevas=[];
      aps.forEach(ap=>{ if(!ap.p && Math.abs(ap.st)>=2 && h>=ap.ini && h<fin){
        ap.p=true; nPres++;
        nuevas.push({et:nom+' · presión '+nPres,ini:h+1,fin,st:0,p:false,hist:new Array(18).fill(null)}); } });
      aps=aps.concat(nuevas); nuevas.forEach(x=>apuestas.push(x));
    }
    porNueve.push(aps.reduce((t,ap)=>t+(ap.st>0?1:(ap.st<0?-1:0)),0));
  });
  apuestas.forEach(ap=>ap.unidad = ap.st>0?1:(ap.st<0?-1:0));
  return {apuestas,porNueve,unidades:porNueve[0]+porNueve[1]};
}
function dineroMatch(d,a,b){
  const m=presionesMatch(d,a,b);
  if(!m.apuestas.some(x=>x.hist.some(v=>v!==null))) return null;   // dia sin capturar
  let ga=0,gb=0; m.apuestas.forEach(x=>{ if(x.unidad>0)ga++; else if(x.unidad<0)gb++; });
  const bono = ga>gb?BONO_MAYORIA:(gb>ga?-BONO_MAYORIA:0);
  return m.porNueve[0]*VALOR_IDA + m.porNueve[1]*VALOR_VUELTA + bono;
}
/* Cuenta acumulada de presiones en los cuatro dias, contra cada rival que te toco */
function cuentaPresiones(){
  const mi=YO();
  const porRival={}, porDia=[]; let gran=0;
  for(let dd=0; dd<DIAS; dd++){
    const g=(S.grupos[dd]||[]).find(x=>x.includes(mi));
    let dDia=null;
    if(g) g.filter(id=>id!==mi).forEach(rid=>{
      const din=dineroConBasura(dd,mi,rid);
      if(din===null) return;
      porRival[rid]=(porRival[rid]||0)+din; gran+=din; dDia=(dDia||0)+din;
    });
    porDia.push(dDia);
  }
  return {porRival,porDia,gran};
}
function setRival(j){ presRival=j; presScrollX=0; render(); }
/* Las dos cuadrículas de Presiones se desplazan juntas, y la posición
   sobrevive al re-render (cada golpe capturado vuelve a pintar la vista). */
let presScrollX=0;
function ligaScrollPresiones(){
  const els=[...document.querySelectorAll('#v-presiones .scroll-x')];
  els.forEach(el=>{
    el.scrollLeft=presScrollX;
    el.onscroll=()=>{ presScrollX=el.scrollLeft;
      els.forEach(o=>{ if(o!==el && Math.abs(o.scrollLeft-presScrollX)>1) o.scrollLeft=presScrollX; }); };
  });
}
/* Cómo va el grupo completo, sin cambiar de rival: por cada uno, los

/* Comprime la foto antes de mandarla: las del iPhone son enormes */
function comprimir(file,maxLado=1600){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const k=Math.min(1,maxLado/Math.max(img.width,img.height));
      const cv=document.createElement('canvas');
      cv.width=Math.round(img.width*k); cv.height=Math.round(img.height*k);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url);
      res(cv.toDataURL('image/jpeg',0.85));
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('No se pudo abrir la imagen')); };
    img.src=url;
  });
}
async function tomarFoto(input){
  const f=input.files[0]; if(!f) return;
  errorIA='';
  try{ foto=await comprimir(f); }
  catch(e){ errorIA='No se pudo abrir esa imagen. Intenta con otra.'; }
  input.value='';
  vistaFoto();
}
