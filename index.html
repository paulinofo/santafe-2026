  const base64=foto.split(',')[1];

  const instruccion =
`Esta es la foto de una tarjeta de golf de ${esc(c.nombre)} (par ${parTotal(c)}).
Los jugadores de este grupo son, en este orden: ${nombres.join(', ')}.

Transcribe los golpes por hoyo de cada jugador. Reglas:
- Devuelve SOLO un objeto JSON, sin explicación, sin markdown, sin backticks.
- Formato exacto: {"jugadores":[{"nombre":"...","golpes":[18 valores]}]}
- Cada golpe es un entero de 1 a 15, o null si el casillero está vacío o no se lee con certeza.
- El arreglo "golpes" siempre trae exactamente 18 posiciones, del hoyo 1 al 18.
- Usa los nombres tal como te los di; si en la tarjeta aparecen abreviados, hazlos coincidir.
- No inventes números: ante la duda, pon null.
- Ignora las filas de par, yardas e índice de dificultad; solo quiero los golpes de los jugadores.`;

  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'content-type':'application/json',
        'x-api-key':S.ia.key,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body:JSON.stringify({
        model:S.ia.modelo, max_tokens:1500,
        messages:[{role:'user',content:[
          {type:'image',source:{type:'base64',media_type:'image/jpeg',data:base64}},
          {type:'text',text:instruccion}
        ]}]
      })
    });
    if(!r.ok){
      const t=await r.text();
      throw new Error(r.status===401?'La API key no es válida. Revísala en Ajustes.'
        :r.status===400&&t.includes('model')?'El modelo no existe. Cámbialo en Ajustes.'
        :'La API respondió '+r.status+'.');
    }
    const data=await r.json();
    const txt=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
    const limpio=txt.replace(/```json|```/g,'').trim();
    const obj=JSON.parse(limpio.slice(limpio.indexOf('{'),limpio.lastIndexOf('}')+1));

    let aplicados=0;
    (obj.jugadores||[]).forEach(item=>{
      const jid=emparejar(item.nombre,grupo);
      if(!jid||!Array.isArray(item.golpes)) return;
      const arr=Array(HOYOS).fill(null);
      item.golpes.slice(0,HOYOS).forEach((g,h)=>{
        const n=parseInt(g);
        if(!isNaN(n)&&n>=1&&n<=15){ arr[h]=n; aplicados++; }
      });
      borrador[jid]=arr;
    });
    if(!aplicados) errorIA='No se reconoció ningún golpe. Prueba con una foto más cerca y derecha, o captúralos a mano.';
  }catch(e){
    errorIA=e.message&&e.message.length<120?e.message
      :'No se pudo leer la tarjeta. Revisa tu conexión o captúralos a mano.';
  }
  leyendo=false; vistaFoto();
}
/* Empareja el nombre que devolvió la IA con uno de los 4 del grupo */
function emparejar(nombre,grupo){
  if(!nombre) return null;
  const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
  const n=norm(nombre);
  let hit=grupo.find(jid=>norm(jug(jid).nombre)===n);
  if(hit) return hit;
  hit=grupo.find(jid=>{ const p=norm(jug(jid).nombre).split(' ')[0]; return n.includes(p)||p.includes(n); });
  return hit||null;
}

/* ============================================================
   4.6b VER EN VIVO — sincronización con Firebase (REST)
   Sin conexión la app funciona igual: los golpes se encolan y se
   suben en cuanto vuelve la señal. Cada golpe lleva sello de tiempo
   y gana el más reciente (por celda), así dos teléfonos no se pisan.
   Los scores vacíos viajan como v:0.
   ============================================================ */
const sincronizando=()=>!!(S.sync&&S.sync.activo&&S.sync.url);
let syncOcupado=false, syncEstado='—', syncUltimo=0, timerSync=null;
const baseSync=()=>S.sync.url.replace(/\/+$/,'')+'/api/torneo/'
  +encodeURIComponent(S.sync.sala||'torneo')+'/scores';
const cabSync=()=>({'content-type':'application/json','X-Torneo-Token':S.sync.token||''});

function programarSync(){ if(!sincronizando())return; clearTimeout(timerSync); timerSync=setTimeout(()=>cicloSync(),1800); }

/* Sube la cola en lotes; el servidor solo acepta el golpe más reciente */
async function empujar(){
  if(!S.pend.length) return;
  const cola=[...S.pend];
  for(let i=0;i<cola.length;i+=200){
    const lote=cola.slice(i,i+200);
    const r=await fetch(baseSync(),{method:'POST',headers:cabSync(),
      body:JSON.stringify({celdas:lote.map(p=>({d:p.d,jid:p.jid,h:p.h,v:p.v,t:p.t}))})});
    if(r.status===401) throw new Error('token');
    if(!r.ok) throw new Error('subida '+r.status);
  }
  S.pend=S.pend.slice(cola.length); guardar();
}
async function jalar(){
  const r=await fetch(baseSync(),{headers:cabSync()});
  if(r.status===401) throw new Error('token');
  if(!r.ok) throw new Error('bajada '+r.status);
  const datos=await r.json();
  let cambios=0;
  (datos.celdas||[]).forEach(c=>{
    if(!c||typeof c.t!=='number') return;
    const mx=String(c.jid||'').match(/^(j\d+)\.x$/);
    if(mx){
      if(!jug(mx[1])) return;
      const lx='x.'+c.d+'.'+mx[1]+'.'+c.h;
      if(!(lx in S.ct)||c.t>S.ct[lx]){ fijarExtra(c.d,mx[1],c.h,c.v|0,c.t); cambios++; }
      return;
    }
    if(!jug(c.jid)) return;
    const llave=c.d+'.'+c.jid+'.'+c.h;
    if(!(llave in S.ct)||c.t>S.ct[llave]){
      fijarScore(c.d,c.jid,c.h,c.v==null?null:c.v,c.t); cambios++;
    }
  });
  return cambios>0;
}
async function cicloSync(){
  if(!sincronizando()||syncOcupado) return;
  syncOcupado=true;
  try{
    await empujar();
    const hubo=await jalar();
    syncEstado='en línea'; syncUltimo=Date.now();
    const tecleando=typeof document!=='undefined'&&document.activeElement
      &&document.activeElement.tagName==='INPUT';
    if(hubo&&!tecleando) render(); else pintarSync();
  }catch(e){ syncEstado = e.message==='token'?'token inválido':'sin señal'; pintarSync(); }
  syncOcupado=false;
}
function pintarSync(){
  const el=$('chipSync'); if(!el||!el.style) return;
  if(!sincronizando()){ el.style.display='none'; return; }
  el.style.display='';
  const vivo=syncEstado==='en línea';
  el.textContent=(vivo?'● en vivo':(syncEstado==='token inválido'?'○ token':'○ sin señal'))
    +(S.pend.length?' · '+S.pend.length+' por subir':'');
  const color=vivo?'var(--ok)':'var(--laton)';
  el.style.borderColor=color; el.style.color=color;
}
function volcarTodo(){
  Object.entries(S.scores||{}).forEach(([kd,jugs])=>{
    const d=+kd.slice(1);
    Object.entries(jugs).forEach(([jid,arr])=>(arr||[]).forEach((v,h)=>{
      if(v!==null) S.pend.push({d,jid,h,v,t:S.ct[d+'.'+jid+'.'+h]||Date.now()});
    }));
  });
  Object.entries(S.extras||{}).forEach(([llave,bits])=>{
    const p=llave.split('.');
    S.pend.push({d:+p[0],jid:p[1]+'.x',h:+p[2],v:bits,t:S.ct['x.'+llave]||Date.now()});
  });
}
function setSync(k,v){
  S.sync[k]= k==='activo'? v : String(v).trim();
  if(k==='activo'&&v) volcarTodo();
  guardar(); render();
  if(sincronizando()) cicloSync();
}

/* ============================================================
   4.6c EN VIVO — publicada como Artifact de Claude
   La app publicada como Artifact se guarda a sí misma: el estado
   compartido viaja en el bloque JSON id="estado-pub" dentro del
   propio HTML. Al abrir, se fusiona celda por celda con la regla
   de siempre (gana el sello de tiempo más reciente, S.ct); al
   capturar, se re-publica el documento completo con debounce y
   la vista de todos se recarga sola con la versión nueva.
   Fuera del visor de claude.ai (espejo de GitHub Pages, archivo
   local) todo esto se apaga solo y el bloque nomás siembra datos.
   ============================================================ */
const ART_URL='https://claude.ai/code/artifact/5d18f4ee-e520-4f15-bf0e-4c7ec55fb254';
const ESPEJO_URL='https://paulinofo.github.io/santafe-2026/';
const ART_DEBOUNCE=45000;    // ms tras la última captura antes de publicar
let art=null, artRO=false, artOcupado=false, artTimer=null, artEstado='';
const enVisor=()=>!!(window.claude&&window.claude.use);

function estadoPubLeer(){
  const el=document.getElementById('estado-pub');
  if(!el) return null;
  try{ return JSON.parse(el.textContent); }catch(e){ return null; }
}
/* La misma regla que jalar(): por celda gana el sello más reciente. */
function aplicarEstadoPub(pub){
  if(!pub) return 0;
  let cambios=0;
  Object.entries(pub.scores||{}).forEach(([kd,jugs])=>{
    const d=+kd.slice(1); if(!(d>=0&&d<DIAS)) return;
    Object.entries(jugs||{}).forEach(([jid,arr])=>{
      if(!jug(jid)||!Array.isArray(arr)) return;
      arr.slice(0,HOYOS).forEach((v,h)=>{
        const val=(v===undefined)?null:v;
        if(val===null&&scoreDe(d,jid,h)===null) return;
        const llave=d+'.'+jid+'.'+h;
        const t=(pub.ct||{})[llave]||pub.t||0;
        if(!(llave in S.ct)||t>S.ct[llave]){
          if(scoreDe(d,jid,h)!==val){ fijarScore(d,jid,h,val,t); cambios++; }
          else if(t>(S.ct[llave]||0)) S.ct[llave]=t;
        }
      });
    });
  });
  Object.entries(pub.extras||{}).forEach(([llave,v])=>{
    const p=llave.split('.'); if(p.length!==3||!jug(p[1])) return;
    const ck='x.'+llave, t=(pub.ct||{})[ck]||pub.t||0;
    if(!(ck in S.ct)||t>S.ct[ck]){
      if((((S.extras||{})[llave])|0)!==(v|0)){ fijarExtra(+p[0],p[1],+p[2],v|0,t); cambios++; }
      else if(t>(S.ct[ck]||0)) S.ct[ck]=t;
    }
  });
  if(pub.grupos&&pub.tg&&pub.tg>(S.tg||0)){ S.grupos=pub.grupos; S.tg=pub.tg; cambios++; }
  if(pub.jugadores&&pub.tj&&pub.tj>(S.tj||0)){
    pub.jugadores.forEach(pj=>{ const j=jug(pj.id); if(j){ j.nombre=pj.nombre; j.indice=pj.indice;
      /* un telefono con la version vieja publica sin corto: que no lo borre */
      if(pj.corto!==undefined) j.corto=pj.corto; } });
    S.tj=pub.tj; cambios++;
  }
  if(cambios) guardar();
  return cambios;
}
/* ¿Este teléfono tiene algo más nuevo que lo ya publicado? */
function artPendiente(pub){
  pub=pub||estadoPubLeer()||{};
  const pct=pub.ct||{}, base=pub.t||0;
  if((S.tg||0)>(pub.tg||base)) return true;
  if((S.tj||0)>(pub.tj||base)) return true;
  return Object.entries(S.ct||{}).some(([k,t])=>t>(pct[k]||base));
}
function estadoPubNuevo(){
  const scores={};
  Object.entries(S.scores||{}).forEach(([kd,jugs])=>{
    const fila={};
    Object.entries(jugs||{}).forEach(([jid,arr])=>{ if(jug(jid)&&Array.isArray(arr)) fila[jid]=arr.slice(0,HOYOS); });
    if(Object.keys(fila).length) scores[kd]=fila;
  });
  return { v:1, t:Date.now(), ct:{...S.ct},
    grupos:S.grupos, tg:S.tg||SEMILLA_TS,
    jugadores:S.jugadores.map(j=>({id:j.id,nombre:j.nombre,indice:j.indice,corto:j.corto||''})), tj:S.tj||SEMILLA_TS,
    extras:{...(S.extras||{})}, scores };
}
function artProgramar(ms){
  if(!art||artRO) return;
  clearTimeout(artTimer);
  artTimer=setTimeout(artPublicar, ms===undefined?ART_DEBOUNCE:ms);
  pintarEstado();
}
async function artPublicar(){
  if(!art||artRO||artOcupado) return;
  if(!artPendiente()){ pintarEstado(); return; }
  artOcupado=true; artEstado='subiendo'; pintarEstado();
  try{
    /* la fuente canónica es el documento servido, nunca el DOM vivo */
    const r=await fetch(location.href,{cache:'no-store'});
    if(!r.ok) throw {code:'fuente'};
    const src=await r.text();
    const rx=new RegExp('<script type="application\\/json" id="estado-pub">[\\s\\S]*?<\\/script>');
    if(!rx.test(src)) throw {code:'sin-bloque'};
    const json=JSON.stringify(estadoPubNuevo()).replace(/</g,'\\u003c');
    const bloque='<script type="application/json" id="estado-pub">'+json+'<\/script>';
    try{ sessionStorage.setItem('santafe-visto','1'); }catch(e){}
    await art.publish(src.replace(rx,()=>bloque));
    artEstado='en vivo';   /* la vista se recarga sola con la versión nueva */
  }catch(e){
    const c=e&&e.code;
    if(c==='not_writer'||c==='not_granted'||c==='not_declared'||c==='consent_required'
       ||c==='capability_disabled'||c==='capability_removed'){
      artRO=true; S.artRO=true; guardar(); artEstado='solo lectura';
    }else if(c==='conflict'){ artEstado='en vivo'; }
    else if(c==='rate_limited'){ artEstado='esperando'; artProgramar(300000); }
    else{ artEstado='sin señal'; artProgramar(90000); }
  }
  artOcupado=false; pintarEstado();
}
function pintarEstado(){
  if(!art){ pintarSync(); return; }
  const el=$('chipSync'); if(!el) return;
  el.style.display='';
  let txt='● en vivo', color='var(--ok)';
  if(!artRO){
    if(artEstado==='subiendo'){ txt='◌ subiendo…'; color='var(--laton)'; }
    else if(artEstado==='sin señal'){ txt='○ sin señal'; color='var(--laton)'; }
    else if(artEstado==='esperando'){ txt='○ esperando'; color='var(--laton)'; }
    else if(artPendiente()){ txt='○ por subir'; color='var(--laton)'; }
  }
  el.textContent=txt; el.style.borderColor=color; el.style.color=color;
}
async function artInit(){
  const pub=estadoPubLeer();
  if(pub){ const n=aplicarEstadoPub(pub); if(n) render(); }   // también siembra el espejo
  if(!enVisor()) return;
  try{ art=await window.claude.use('artifact'); }catch(e){ art=null; }
  if(!art) return;
  artRO=!!S.artRO;
  artEstado='en vivo';
  window.addEventListener('online',()=>artProgramar(4000));
  setInterval(()=>{ if(artPendiente()) artProgramar(8000); },90000);
  if(artPendiente()) artProgramar(12000);
  render();
}

/* ============================================================
   4.6d ESPEJO SEMI-VIVO — fuera del visor (GitHub Pages), la app
   jala su propio HTML publicado con rompe-caché y fusiona el
   bloque estado-pub: cada minuto, al recuperar señal y cada vez
   que la app vuelve al frente. Así el espejo se actualiza solo
   aunque el iPhone cachee la página instalada.
   ============================================================ */
let espejoOcupado=false;
async function refrescarEspejo(){
  if(enVisor()||espejoOcupado||location.protocol==='file:') return;
  espejoOcupado=true;
  try{
    const r=await fetch(location.pathname+'?sync='+Date.now(),{cache:'no-store'});
    if(r.ok){
      const t=await r.text();
      const m=t.match(/<script type="application\/json" id="estado-pub">([\s\S]*?)<\/script>/);
      if(m){ const n=aplicarEstadoPub(JSON.parse(m[1])); if(n) render(); }
    }
  }catch(e){ /* sin señal: se reintenta solo */ }
  espejoOcupado=false;
}

/* ============================================================
   4.7 COMPARTIR Y UNIR SCORES
   Cada teléfono guarda su propia copia. Para que varios puedan
   anotar, cada quien manda su día en un código corto por WhatsApp
   y el que lo recibe lo une: se rellenan los huecos y se avisa
   de cualquier golpe que venga distinto.
   ============================================================ */
const CH='-123456789ABCDEF';   // 0 = sin anotar, 1-15 = golpes

function codificarDia(d){
  const partes=S.jugadores.map(j=>{
    const arr=Array.from({length:HOYOS},(_,h)=>scoreDe(d,j.id,h));
    if(arr.every(v=>v===null)) return null;
    return j.id+':'+arr.map(v=>CH[v==null?0:Math.min(15,Math.max(1,v))]).join('');
  }).filter(Boolean);
  return partes.length? 'SF26.'+d+'.'+partes.join(',') : null;
}
function decodificar(txt){
  const m=String(txt||'').trim().match(/SF26\.(\d)\.([^\s]+)/);
  if(!m) return null;
  const out={};
  m[2].split(',').forEach(p=>{
    const [jid,cad]=p.split(':');
    if(!jid||!cad||cad.length<HOYOS) return;
    out[jid]=cad.slice(0,HOYOS).split('').map(c=>{ const i=CH.indexOf(c); return i<=0?null:i; });
  });
  return Object.keys(out).length? {dia:+m[1],scores:out} : null;
}

/* ------------------------------------------------------------
   SEMILLA: rondas ya jugadas que viajan dentro del archivo, para
   que quien abra la app por primera vez llegue con el torneo al
   corriente sin pegar códigos a mano. Se aplica una sola vez por
   código y jamás pisa un golpe ya capturado. Va marcada con la
   fecha de la ronda, no con la de hoy, para que cualquier
   corrección posterior le gane al sincronizar.
   ------------------------------------------------------------ */
const SEMILLAS = [   /* rondas digitalizadas de tarjeta física */
  'SF26.0.j0:453464645563746544,j1:453454655535446545',
  'SF26.0.j2:846846976639597455'
];
const SEMILLA_TS = Date.UTC(2026,8,12);      // arranque del Sáb 12 sep
function sembrar(){
  if(!Array.isArray(S.semillas)) S.semillas=[];
  let puestos=0;
  SEMILLAS.forEach((cod,i)=>{
    if(S.semillas.indexOf(i)>=0) return;
    const dec=decodificar(cod);
    if(!dec) return;
    Object.entries(dec.scores).forEach(([jid,arr])=>{
      if(!jug(jid)) return;
      arr.forEach((v,h)=>{
        if(v===null) return;
        if(scoreDe(dec.dia,jid,h)!==null) return;   // respeta lo capturado
        fijarScore(dec.dia,jid,h,v,SEMILLA_TS); puestos++;
      });
    });
    S.semillas.push(i);
  });
  if(puestos) guardar();
  return puestos;
}

let msgUnir='', errUnir='';
function unirCodigo(txt,sobrescribir){
  const dec=decodificar(txt);
  if(!dec){ errUnir='Ese código no se entiende. Cópialo completo, empieza con SF26.'; msgUnir=''; render(); return; }
  let nuevos=0, choques=0, iguales=0;
  Object.entries(dec.scores).forEach(([jid,arr])=>{
    if(!jug(jid)) return;
    arr.forEach((v,h)=>{
      if(v===null) return;
      const mio=scoreDe(dec.dia,jid,h);
      if(mio===null){ fijarScore(dec.dia,jid,h,v); nuevos++; }
      else if(mio!==v){ choques++; if(sobrescribir) fijarScore(dec.dia,jid,h,v); }
      else iguales++;
    });
  });
  const dia=S.campos[dec.dia];
  msgUnir=`${dia.fecha} · ${dia.nombre}: ${nuevos} golpes nuevos, ${iguales} que ya coincidían`
    + (choques? `, ${choques} distintos ${sobrescribir?'reemplazados':'que se conservaron como los tenías'}.`:'.');
  errUnir=choques&&!sobrescribir? 'Hay '+choques+' golpes que no coinciden. Si el otro teléfono tiene la versión buena, vuelve a unir con Reemplazar.':'';
  guardar(); render();
}
/* Reenvía la app al grupo: intenta mandar el archivo y, si el iPhone no
   deja adjuntarlo, manda el instructivo para que lo bajen de donde esté. */

async function compartirDia(){
  const d=S.diaActivo, cod=codificarDia(d);
  if(!cod){ alert('Todavía no hay golpes capturados en este día.'); return; }
  const texto=S.campos[d].fecha+' · '+S.campos[d].nombre+' — scores del Santa Fe 2026.\n'
    +'Pégalo en Ajustes → Unir scores.\n\n'+cod;
  try{
    if(navigator.share){ await navigator.share({text:texto}); return; }
    await navigator.clipboard.writeText(texto);
    alert('Código copiado. Pégalo en el grupo de WhatsApp.');
  }catch(e){
    prompt('Copia este código y mándalo por WhatsApp:',cod);
  }
}

/* ============================================================
   5. NAVEGACIÓN
   ============================================================ */
const VISTAS=[
  {id:'hoy',et:'Hoy',svg:'<path d="M12 3v10"/><path d="M12 3l7 3-7 3"/><circle cx="12" cy="19" r="2"/>'},
  {id:'tarjeta',et:'Tarjeta',svg:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11"/>'},
  {id:'pos',et:'Tabla',svg:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'},
  {id:'presiones',et:'Presiones',svg:'<path d="M4 19h16"/><path d="M7 19V9"/><path d="M12 19V5"/><path d="M17 19v-6"/><circle cx="12" cy="5" r="1.6"/>'},
  {id:'grupos',et:'Grupos',svg:'<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9.5" r="2.4"/><path d="M3 20c0-3.4 2.6-6 6-6s6 2.6 6 6"/><path d="M15.5 14.6c2.6.5 4.5 2.7 4.5 5.4"/>'},
  {id:'ajustes',et:'Ajustes',svg:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'}
];
/* Stableford puro: la pestaña de apuestas no se dibuja */
if(!MUESTRA_DINERO) VISTAS.splice(VISTAS.findIndex(v=>v.id==='presiones'),1);
function pintarNav(){
  $('nav').innerHTML=VISTAS.map(v=>`<button class="${S.vista===v.id?'on':''}" onclick="setVista('${v.id}')">
    <svg viewBox="0 0 24 24">${v.svg}</svg>${v.et}</button>`).join('');
}
function setVista(v){ S.vista=v; guardar(); render(); }
/* la barra de campos arranca plegada: en el campo se agradece la pantalla */
let diasAbierto=false;
function toggleDias(){ diasAbierto=!diasAbierto; render(); }
function setDia(d){ S.diaActivo=d; S.hoyoActivo=0; borrador=null; diasAbierto=false; guardar(); render(); }

function render(){
  $('tituloTorneo').textContent=S.torneo.nombre;
  $('chipFormato').textContent=(esStableford()?'Stableford':'Stroke')+(S.torneo.usarHcp?' · neto':' · bruto');
  $('quienSoy').textContent=(S.yo&&jug(S.yo))?jug(S.yo).nombre:'';
  $('tabsDias').innerHTML=S.campos.map((c,d)=>
    `<button class="dia ${S.diaActivo===d?'on':''}" onclick="setDia(${d})">
      <b>${esc(c.nombre)}</b><i>${esc(c.fecha)} · ${esc(c.salidas[0])}</i></button>`).join('');
  /* en Tabla los campos del encabezado estorban: la vista trae sus propias pestañas por día */
  const sinCampos=S.vista==='pos';
  const cRes=S.campos[S.diaActivo];
  $('diaResumen').innerHTML=`<b>${esc(cRes.nombre)}</b>`
    +`<i>${esc(cRes.fecha)} · ${esc(cRes.salidas[0])}</i><u>${diasAbierto?'cerrar ▴':'cambiar ▾'}</u>`;
  $('diaResumen').style.display=sinCampos?'none':'';
  $('tabsDias').style.display=(sinCampos||!diasAbierto)?'none':'';
  $('cabecera').style.paddingBottom=sinCampos?'11px':'';
  VISTAS.forEach(v=>$('v-'+v.id).classList.toggle('on',S.vista===v.id));
  ({hoy:vistaHoy,grupos:vistaGrupos,tarjeta:vistaTarjeta,pos:vistaPos,presiones:vistaPresiones,ajustes:vistaAjustes})[S.vista]();
  pintarNav();
  pintarEstado();
}

/* ============================================================
   5b. ZOOM DE PELLIZCO
   El visor bloquea el zoom nativo, así que la app trae el suyo:
   pellizca con dos dedos para acercar (hasta 2.5×) y el botón
   flotante regresa al tamaño original.
   ============================================================ */
let zoomBase=1, zoomActual=1, pinchD0=0;
function aplicaZoom(z){
  zoomActual=Math.max(1,Math.min(2.5,z));
  document.body.style.zoom=(zoomActual===1)?'':String(zoomActual);
  const b=$('zoomReset'); if(b) b.style.display=zoomActual>1?'':'none';
}
function zoomOriginal(){ aplicaZoom(1); }
/* pellizco con eventos táctiles estándar: la distancia entre los dos dedos
   marca la escala (los GestureEvents de iOS no siempre llegan en el visor) */
const distPellizco=t=>Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
document.addEventListener('touchstart',e=>{
  if(e.touches.length===2){ pinchD0=distPellizco(e.touches); zoomBase=zoomActual; }
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(e.touches.length===2&&pinchD0>0){
    e.preventDefault();
    aplicaZoom(zoomBase*distPellizco(e.touches)/pinchD0);
  }
},{passive:false});
document.addEventListener('touchend',e=>{ if(e.touches.length<2) pinchD0=0; },{passive:true});
/* suprime el intento de zoom nativo del navegador, que aquí no hace nada */
window.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
window.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});

cargar();
setTimeout(()=>{ const p=document.getElementById('portada'); p&&p.remove(); }, 2700);
render();
pintarPortadaNombre();
if(!S.yo) mostrarQuien();     // primera vez en este teléfono: elegir quién eres
if(enPantallaInicio()&&!S.instalada){ S.instalada=true; guardar(); }   // ya corre como app
else if(S.yo&&!S.instalada) mostrarInstalador();   // recordar la instalación hasta que quede
if(sincronizando()) cicloSync();
setInterval(()=>cicloSync(), 15000);
artInit();
if(!enVisor()&&location.protocol!=='file:'){   // espejo: refresco automático
  setInterval(refrescarEspejo,60000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) refrescarEspejo(); });
  window.addEventListener('online',refrescarEspejo);
  refrescarEspejo();
}
